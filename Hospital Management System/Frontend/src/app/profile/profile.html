<div class="profile-container">
  <div class="row align-items-start g-4">

    <!-- Profile Card -->
    <div class="col-lg-4">
      <div class="premium-card text-center shadow-sm border-0">
        <div class="card-body p-4">
          <div class="avatar-lg mx-auto mb-3 shadow-sm">
            A
          </div>
          <h3 class="fw-bold mb-1">Faisal</h3>
          <p class="text-muted mb-3">Super Admin</p>
          <hr class="text-muted opacity-25">
          <div class="text-start mt-4">
            <p class="mb-3 d-flex align-items-center"><i class="bi bi-person-badge text-primary me-3 fs-5"></i> <span
                class="fw-medium text-muted me-2">Role:</span> <strong style="color: #2b3674;">Administrator</strong>
            </p>
            <p class="mb-3 d-flex align-items-center"><i class="bi bi-envelope text-primary me-3 fs-5"></i> <span
                class="fw-medium text-muted me-2">Email:</span> <strong
                style="color: #2b3674;">faisal@hospital.com</strong></p>
            <p class="mb-3 d-flex align-items-center"><i class="bi bi-telephone text-primary me-3 fs-5"></i> <span
                class="fw-medium text-muted me-2">Phone:</span> <strong style="color: #2b3674;">+91 7830802065</strong>
            </p>
            <p class="mb-0 d-flex align-items-center"><i class="bi bi-calendar-check text-primary me-3 fs-5"></i> <span
                class="fw-medium text-muted me-2">Joined:</span> <strong style="color: #2b3674;">August 2026</strong>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="col-lg-8">
      <div class="premium-card shadow-sm border-0 h-100">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
          <h4 class="fw-bold"><i class="bi bi-shield-lock text-primary me-2"></i> Change Password</h4>
          <p class="text-muted small mb-0">Ensure your account is using a long, random password to stay secure.</p>
        </div>
        <div class="card-body p-4">
          <form>
            <div class="mb-4">
              <label class="form-label fw-medium text-muted">Current Password</label>
              <div class="password-wrapper">
                <input #currentPwd type="password" class="form-control premium-input"
                  placeholder="Enter your current password">
                <i class="bi password-toggle" [class.bi-eye]="currentPwd.type === 'text'"
                  [class.bi-eye-slash]="currentPwd.type === 'password'"
                  (click)="currentPwd.type = currentPwd.type === 'password' ? 'text' : 'password'"></i>
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label fw-medium text-muted">New Password</label>
                <div class="password-wrapper">
                  <input #newPwd type="password" class="form-control premium-input" placeholder="Enter new password">
                  <i class="bi password-toggle" [class.bi-eye]="newPwd.type === 'text'"
                    [class.bi-eye-slash]="newPwd.type === 'password'"
                    (click)="newPwd.type = newPwd.type === 'password' ? 'text' : 'password'"></i>
                </div>
              </div>
              <div class="col-md-6 mt-4 mt-md-0">
                <label class="form-label fw-medium text-muted">Confirm New Password</label>
                <div class="password-wrapper">
                  <input #confirmPwd type="password" class="form-control premium-input"
                    placeholder="Confirm new password">
                  <i class="bi password-toggle" [class.bi-eye]="confirmPwd.type === 'text'"
                    [class.bi-eye-slash]="confirmPwd.type === 'password'"
                    (click)="confirmPwd.type = confirmPwd.type === 'password' ? 'text' : 'password'"></i>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end mt-4 pt-2 border-top">
              <button type="button" class="btn btn-light px-4 me-3 mt-3 rounded-pill fw-medium">Cancel</button>
              <button type="button" class="btn btn-primary px-5 shadow-sm rounded-pill mt-3 fw-medium">Update
                Password</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
