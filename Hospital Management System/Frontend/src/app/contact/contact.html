<div class="page-container">
  <div class="page-header">
    <h1>Contact Us</h1>
    <p>We're here to help. Reach out to us with any questions or concerns.</p>
  </div>
  
  <div class="contact-content">
    <div class="contact-info">
      <div class="info-item">
        <div class="icon">📍</div>
        <div>
          <h3>Visit Us</h3>
          <p>123 Health Avenue, Medical District</p>
        </div>
      </div>
      <div class="info-item">
        <div class="icon">📞</div>
        <div>
          <h3>Call Us</h3>
          <p>+1 234 567 8900</p>
        </div>
      </div>
      <div class="info-item">
        <div class="icon">✉️</div>
        <div>
          <h3>Email Us</h3>
          <p>info@carehospital.com</p>
        </div>
      </div>
    </div>
    
    <div class="contact-form-container">
      <div *ngIf="submitted" class="success-message">
        Thank you for your message! We will get back to you shortly.
      </div>
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" formControlName="name" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" formControlName="email" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" formControlName="message" placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" [disabled]="!contactForm.valid" class="btn btn-primary w-100">Send Message</button>
      </form>
    </div>
  </div>
</div>
